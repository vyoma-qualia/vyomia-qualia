<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>vyomia qualia</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body data-theme="dark">
  <header class="site-header" aria-hidden="true"></header>

  <main class="hero">
    <div class="effect-layer" aria-hidden="true">
      <div class="corner-dot corner-dot--top-left"></div>
      <div class="corner-dot corner-dot--top-right"></div>
      <div class="corner-dot corner-dot--bottom-left"></div>
      <div class="corner-dot corner-dot--bottom-right"></div>
      <div class="sprite-field"></div>
    </div>

    <section class="hero-inner">
      <div class="logo-stage">
        <img id="heroLogo" class="hero-logo" src="assets/V%20Y%20O%20M%20A%20_%20Q%20U%20A%20L%20I%20A%20_%20Logo.png" alt="Vyomia Qualia logo" />
      </div>
    </section>

    <section class="buffer-wrap">
      <div class="orbit-system">
        <div class="orbit-field" aria-hidden="true"></div>
        <img class="cbuffer" src="assets/loading-buffer-svgrepo-com.svg" alt="Loading buffer" />
      </div>
      <div class="logo-stage">
        <img id="orbitLogo" class="hero-logo" src="assets/V%20Y%20O%20M%20A%20_%20Q%20U%20A%20L%20I%20A%20_%20Logo.png" alt="Vyomia Qualia logo" />
      </div>
    </section>

    <section class="image-reveal">
      <img class="scroll-image" src="assets/Vyoma%20Qualia%20_%20Meaning%20_%20for%20website.png" alt="Vyoma Qualia meaning" />
    </section>

    <section class="image-reveal">
      <img class="scroll-image" src="assets/VQ%20_%20IG%20QR%20_%20For%20website.png" alt="Vyoma Qualia Instagram QR code" />
    </section>
  </main>

  <script src="scripts/script.js"></script>
</body>
</html>
